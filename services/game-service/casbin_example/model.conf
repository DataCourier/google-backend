# Casbin Model for Org Notes
# RBAC with resource types and actions

[request_definition]
r = sub, org, resource, action

[policy_definition]
p = role, org, resource, action

[role_definition]
g = _, _, _    # user, role, org (role assignment per org)

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.role, r.org) && r.org == p.org && r.resource == p.resource && r.action == p.action
